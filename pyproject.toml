[project]
name = "sintetica"
version = "0.1.0"
description = "Geração de dados sintéticos orientada por intenção, como skills de harnesses de IA."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "faker>=30.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
sintetica = "sintetica.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sintetica"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faker", "faker.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", ".claude", ".reversa", "_reversa_*", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not perf and not live'"
markers = [
    "perf: testes de desempenho, fora da suíte padrão (rode com -m perf)",
    "live: testes de fumaça com API real, geram custo (rode com -m live)",
    "codegen: verificação estática do código gerado pelo schema-builder (incluída na suíte padrão)",
]

[tool.coverage.run]
source = ["sintetica"]
branch = true

[tool.coverage.report]
show_missing = true
